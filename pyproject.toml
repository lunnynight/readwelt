[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "readwelt"
version = "0.1.0"
description = "Local-first reverse-reading runtime"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.12,<3",
  "xberg==1.0.0rc38",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]
mcp = [
  "mcp>=1.27,<2",
]
dense = [
  "sentence-transformers>=5.1,<6",
  "transformers>=4.41,<5",
]
linguistic = [
  "stanza==1.14.0",
]
structural = [
  "docling[rapidocr]==2.114.0",
]
all = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "mcp>=1.27,<2",
  "docling[rapidocr]==2.114.0",
  "stanza==1.14.0",
]

[project.scripts]
readwelt = "readwelt.cli.main:main"
readwelt-api = "readwelt.api.app:run"
readwelt-mcp = "readwelt.mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.maturin]
manifest-path = "crates/readwelt-py/Cargo.toml"
module-name = "readwelt._core"
python-source = "src"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["readwelt"]
mypy_path = "src"
