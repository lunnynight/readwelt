[workspace]
members = [
    "crates/readwelt-core",
    "crates/readwelt-py",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
blake2 = "0.10.6"
pyo3 = "0.25.1"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
unicode-normalization = "0.1.24"
