name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate skill and evaluation cases
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(".")
          skill = (root / "skills/readwelt/SKILL.md").read_text(encoding="utf-8")
          if not skill.startswith("---\n"):
              sys.exit("SKILL.md must start with YAML frontmatter")
          frontmatter = skill.split("---", 2)[1]
          for field in ("name:", "description:"):
              if field not in frontmatter:
                  sys.exit(f"SKILL.md frontmatter is missing {field}")

          cases = json.loads((root / "evals/readwelt/cases.json").read_text(encoding="utf-8"))
          if not cases.get("cases"):
              sys.exit("eval cases must not be empty")
          for case in cases["cases"]:
              for field in ("id", "source", "prompt", "expectations"):
                  if field not in case:
                      sys.exit(f"eval case missing {field}: {case.get('id')}")
              if not (root / "evals/readwelt" / case["source"]).is_file():
                  sys.exit(f"eval source is missing: {case['source']}")

          compile(
              (root / "evals/readwelt/check_quotes.py").read_text(encoding="utf-8"),
              "check_quotes.py",
              "exec",
          )
          print(f"validated {len(cases['cases'])} eval cases")
          PY
